$kind: http-request
auth:
  type: noauth
order: 500
method: POST
url: "{{baseUrl}}/auth/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has accessToken", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("accessToken");
          pm.expect(json.accessToken).to.be.a("string").and.not.empty;
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Store JWT token in environment variable
      var json = pm.response.json();
      if (json && json.accessToken) {
          pm.environment.set("accessToken", json.accessToken);
      }
    language: text/javascript
